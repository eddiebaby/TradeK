apiVersion: apps/v1
kind: Deployment
metadata:
  name: tradeknowledge-api
  labels:
    app: tradeknowledge-api
    version: v1.0.0
spec:
  replicas: 3
  selector:
    matchLabels:
      app: tradeknowledge-api
  template:
    metadata:
      labels:
        app: tradeknowledge-api
        version: v1.0.0
    spec:
      containers:
      - name: api
        image: tradeknowledge/api:latest
        ports:
        - containerPort: 8000
          name: http
        env:
        - name: ENVIRONMENT
          value: "production"
        - name: LOG_LEVEL
          value: "INFO"
        resources:
          requests:
            memory: "256Mi"
            cpu: "100m"
          limits:
            memory: "512Mi"
            cpu: "500m"
        livenessProbe:
          httpGet:
            path: /health/live
            port: 8000
          initialDelaySeconds: 30
          periodSeconds: 10
          timeoutSeconds: 5
          failureThreshold: 3
        readinessProbe:
          httpGet:
            path: /health/ready
            port: 8000
          initialDelaySeconds: 5
          periodSeconds: 5
          timeoutSeconds: 3
          failureThreshold: 3
        securityContext:
          runAsNonRoot: true
          runAsUser: 1000
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: false
          capabilities:
            drop:
            - ALL
---
apiVersion: v1
kind: Service
metadata:
  name: tradeknowledge-api-service
  labels:
    app: tradeknowledge-api
spec:
  selector:
    app: tradeknowledge-api
  ports:
  - name: http
    port: 80
    targetPort: 8000
    protocol: TCP
  type: ClusterIP
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: tradeknowledge-api-ingress
  annotations:
    nginx.ingress.kubernetes.io/rate-limit: "100"
    nginx.ingress.kubernetes.io/rate-limit-window: "1m"
    nginx.ingress.kubernetes.io/ssl-redirect: "true"
spec:
  tls:
  - hosts:
    - api.tradeknowledge.local
    secretName: tradeknowledge-tls
  rules:
  - host: api.tradeknowledge.local
    http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: tradeknowledge-api-service
            port:
              number: 80