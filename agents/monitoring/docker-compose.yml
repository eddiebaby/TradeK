version: '3.8'

services:
  grafana:
    image: grafana/grafana:latest
    container_name: agent-grafana
    ports:
      - "3000:3000"
    environment:
      - GF_SECURITY_ADMIN_PASSWORD=agentmonitoring123
    volumes:
      - grafana-storage:/var/lib/grafana
      - ./grafana/provisioning:/etc/grafana/provisioning
      - ./grafana/dashboards:/var/lib/grafana/dashboards
    networks:
      - agent-monitoring
    restart: unless-stopped
    # External InfluxDB dependency

  # Note: Using external InfluxDB blackboard container at localhost:8087

volumes:
  grafana-storage:

networks:
  agent-monitoring:
    driver: bridge