# FIRE Production Configuration
# Configuration for production-ready SPARC trio deployment

version: "1.0"
environment: production

# SPARC Trio Configuration
trio:
  researcher:
    model: "gemini-pro"
    context_size: 1000000
    specialization: "intelligence_synthesis"
    capabilities:
      - web_research
      - data_analysis
      - security_research
      - performance_analysis
      - market_intelligence
    
  mastermind:
    model: "claude-3.5-sonnet"
    context_size: 200000
    specialization: "strategic_architecture"
    capabilities:
      - system_design
      - architecture_planning
      - risk_assessment
      - quality_orchestration
      - technology_selection
    
  executor:
    model: "claude-3.5-sonnet"
    context_size: 200000
    specialization: "implementation_virtuosity"
    capabilities:
      - tdd_implementation
      - code_generation
      - testing_frameworks
      - devops_automation
      - performance_optimization

# Production Quality Gates
quality_gates:
  test_coverage: 98
  mutation_score: 90
  security_score: 9.8
  performance_sla:
    response_time: 50  # milliseconds
    throughput: 10000  # requests per second
    availability: 99.99  # percentage
    memory_limit: "2Gi"
    cpu_limit: "1000m"
  
  compliance:
    - SOC2
    - GDPR
    - FINRA
    - PCI-DSS
  
  code_quality:
    cyclomatic_complexity: 10
    maintainability_index: 85
    technical_debt: "< 8 hours"

# Technology Stack Configurations
stacks:
  fastapi:
    base_image: "python:3.12-slim"
    dependencies:
      - "fastapi[all]"
      - "uvicorn[standard]"
      - "pydantic"
      - "sqlalchemy"
      - "alembic"
    testing:
      - "pytest"
      - "pytest-asyncio"
      - "httpx"
      - "pytest-cov"
    
  django:
    base_image: "python:3.12-slim"
    dependencies:
      - "django"
      - "djangorestframework"
      - "celery"
      - "redis"
    testing:
      - "pytest-django"
      - "factory-boy"
    
  pytorch:
    base_image: "pytorch/pytorch:latest"
    dependencies:
      - "torch"
      - "torchvision"
      - "transformers"
      - "numpy"
      - "pandas"
    testing:
      - "pytest"
      - "tensorboard"

# Deployment Configurations
deployment:
  docker:
    registry: "ghcr.io/tradeknowledge"
    tag_strategy: "semantic"
    multi_stage: true
    security:
      - "non-root-user"
      - "minimal-dependencies"
      - "vulnerability-scanning"
    
  kubernetes:
    namespace: "tradeknowledge-prod"
    replicas: 3
    auto_scaling:
      min_replicas: 3
      max_replicas: 20
      target_cpu: 70
      target_memory: 80
    
    resources:
      requests:
        cpu: "500m"
        memory: "1Gi"
      limits:
        cpu: "1000m"
        memory: "2Gi"
    
    security:
      network_policies: true
      pod_security_standards: "restricted"
      service_account: "sparc-trio"
    
  serverless:
    provider: "aws"
    runtime: "python3.12"
    timeout: 30
    memory: 1024
    environment_variables:
      - "STAGE=production"
    
    vpc_config:
      security_group_ids: []
      subnet_ids: []

# Monitoring & Observability
monitoring:
  metrics:
    prometheus:
      enabled: true
      port: 9090
      path: "/metrics"
    
    custom_metrics:
      - "trio_task_duration"
      - "agent_response_time"
      - "quality_gate_success_rate"
      - "deployment_frequency"
      - "mean_time_to_recovery"
  
  logging:
    level: "INFO"
    format: "json"
    destinations:
      - "stdout"
      - "file"
      - "elasticsearch"
    
    correlation_id: true
    structured: true
  
  tracing:
    enabled: true
    sampling_rate: 0.1
    exporter: "jaeger"
  
  alerts:
    channels:
      - "slack"
      - "email"
      - "pagerduty"
    
    rules:
      - name: "high_error_rate"
        condition: "error_rate > 5%"
        severity: "critical"
      
      - name: "slow_response"
        condition: "p95_response_time > 100ms"
        severity: "warning"
      
      - name: "resource_exhaustion"
        condition: "memory_usage > 90%"
        severity: "critical"

# Security Configuration
security:
  authentication:
    method: "jwt"
    issuer: "tradeknowledge.ai"
    audience: "sparc-trio"
    algorithm: "RS256"
  
  authorization:
    rbac: true
    policies:
      - "admin"
      - "developer"
      - "readonly"
  
  encryption:
    at_rest: true
    in_transit: true
    key_management: "vault"
  
  rate_limiting:
    enabled: true
    requests_per_minute: 1000
    burst_size: 100
  
  cors:
    enabled: true
    allowed_origins:
      - "https://tradeknowledge.ai"
      - "https://app.tradeknowledge.ai"
    allowed_methods:
      - "GET"
      - "POST"
      - "PUT"
      - "DELETE"
    
  security_headers:
    - "X-Frame-Options: DENY"
    - "X-Content-Type-Options: nosniff"
    - "X-XSS-Protection: 1; mode=block"
    - "Strict-Transport-Security: max-age=31536000"

# Environment Variables
environment_variables:
  production:
    LOG_LEVEL: "INFO"
    DEBUG: "false"
    ENVIRONMENT: "production"
    DATABASE_URL: "${DATABASE_URL}"
    REDIS_URL: "${REDIS_URL}"
    SECRET_KEY: "${SECRET_KEY}"
    
  staging:
    LOG_LEVEL: "DEBUG"
    DEBUG: "true"
    ENVIRONMENT: "staging"
    
  development:
    LOG_LEVEL: "DEBUG"
    DEBUG: "true"
    ENVIRONMENT: "development"

# Backup & Recovery
backup:
  enabled: true
  schedule: "0 2 * * *"  # Daily at 2 AM
  retention: "30d"
  destinations:
    - "s3://tradeknowledge-backups"
  
  recovery:
    rto: "15 minutes"  # Recovery Time Objective
    rpo: "1 hour"     # Recovery Point Objective

# Integration Points
integrations:
  databases:
    - postgresql
    - redis
    - influxdb
  
  message_queues:
    - rabbitmq
    - kafka
  
  external_apis:
    - openai
    - anthropic
    - perplexity
    - github
  
  monitoring_tools:
    - prometheus
    - grafana
    - jaeger
    - elasticsearch