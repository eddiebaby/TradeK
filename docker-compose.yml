# Docker Compose configuration for TradeKnowledge
version: '3.8'

services:
  # Main API service
  tradeknowledge-api:
    build:
      context: .
      dockerfile: Dockerfile
      target: production
    container_name: tradeknowledge-api
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      - ENVIRONMENT=production
      - JWT_SECRET_KEY=${JWT_SECRET_KEY:-change-in-production}
      - CORS_ORIGINS=${CORS_ORIGINS:-*}
      - QDRANT_HOST=qdrant
      - QDRANT_PORT=6333
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - OLLAMA_HOST=http://ollama:11434
      # InfluxDB configuration for ML backfill
      - INFLUXDB_URL=http://influxdb:8086
      - INFLUXDB_TOKEN=${INFLUXDB_ADMIN_TOKEN:-tradeknowledge-super-secret-token}
      - INFLUXDB_ORG=${INFLUXDB_ORG:-tradeknowledge}
      - INFLUXDB_BUCKET=${INFLUXDB_BUCKET:-market_data}
    volumes:
      - ./data:/app/data
      - ./logs:/app/logs
      - ./config:/app/config:ro
    depends_on:
      - qdrant
      - redis
      - ollama
      - influxdb
    networks:
      - tradeknowledge

  # Vector database
  qdrant:
    image: qdrant/qdrant:v1.7.4
    container_name: tradeknowledge-qdrant
    restart: unless-stopped
    ports:
      - "6333:6333"
      - "6334:6334"
    volumes:
      - qdrant_data:/qdrant/storage
    environment:
      - QDRANT__SERVICE__HTTP_PORT=6333
      - QDRANT__SERVICE__GRPC_PORT=6334
    networks:
      - tradeknowledge

  # Redis cache
  redis:
    image: redis:7-alpine
    container_name: tradeknowledge-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    command: redis-server --appendonly yes --maxmemory 256mb --maxmemory-policy allkeys-lru
    networks:
      - tradeknowledge

  # Ollama for local embeddings
  ollama:
    image: ollama/ollama:latest
    container_name: tradeknowledge-ollama
    restart: unless-stopped
    ports:
      - "11434:11434"
    volumes:
      - ollama_data:/root/.ollama
    environment:
      - OLLAMA_ORIGINS=*
    networks:
      - tradeknowledge
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]

  # Nginx reverse proxy
  nginx:
    image: nginx:alpine
    container_name: tradeknowledge-nginx
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
      - ./ssl:/etc/nginx/ssl:ro
      - nginx_logs:/var/log/nginx
    depends_on:
      - tradeknowledge-api
    networks:
      - tradeknowledge

  # Monitoring with Prometheus
  prometheus:
    image: prom/prometheus:latest
    container_name: tradeknowledge-prometheus
    restart: unless-stopped
    ports:
      - "9090:9090"
    volumes:
      - ./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--web.console.libraries=/etc/prometheus/console_libraries'
      - '--web.console.templates=/etc/prometheus/consoles'
      - '--storage.tsdb.retention.time=200h'
      - '--web.enable-lifecycle'
    networks:
      - tradeknowledge

  # Grafana for dashboards
  grafana:
    image: grafana/grafana:latest
    container_name: tradeknowledge-grafana
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      - GF_SECURITY_ADMIN_PASSWORD=${GRAFANA_PASSWORD:-admin}
    volumes:
      - grafana_data:/var/lib/grafana
      - ./monitoring/grafana/dashboards:/etc/grafana/provisioning/dashboards:ro
      - ./monitoring/grafana/datasources:/etc/grafana/provisioning/datasources:ro
    networks:
      - tradeknowledge

  # InfluxDB for ML-ready time-series data
  influxdb:
    image: influxdb:2.7-alpine
    container_name: tradeknowledge-influxdb
    restart: unless-stopped
    ports:
      - "8086:8086"
    environment:
      # Initial setup configuration
      - DOCKER_INFLUXDB_INIT_MODE=setup
      - DOCKER_INFLUXDB_INIT_USERNAME=${INFLUXDB_ADMIN_USERNAME:-admin}
      - DOCKER_INFLUXDB_INIT_PASSWORD=${INFLUXDB_ADMIN_PASSWORD:-tradeknowledge123}
      - DOCKER_INFLUXDB_INIT_ORG=${INFLUXDB_ORG:-tradeknowledge}
      - DOCKER_INFLUXDB_INIT_BUCKET=${INFLUXDB_BUCKET:-market_data}
      - DOCKER_INFLUXDB_INIT_RETENTION=${INFLUXDB_RETENTION:-0s}
      - DOCKER_INFLUXDB_INIT_ADMIN_TOKEN=${INFLUXDB_ADMIN_TOKEN:-tradeknowledge-super-secret-token}
      # Performance and storage configuration
      - INFLUXD_ENGINE_PATH=/var/lib/influxdb2
      - INFLUXD_BOLT_PATH=/var/lib/influxdb2/influxd.bolt
      - INFLUXD_REPORTING_DISABLED=true
      # ML workload optimizations
      - INFLUXD_QUERY_CONCURRENCY=10
      - INFLUXD_QUERY_QUEUE_SIZE=1000
      - INFLUXD_HTTP_WRITE_TIMEOUT=30s
      - INFLUXD_HTTP_READ_TIMEOUT=30s
    volumes:
      # Persistent data storage
      - influxdb_data:/var/lib/influxdb2
      - influxdb_config:/etc/influxdb2
      # Initialization scripts
      - ./docker/influxdb/init:/docker-entrypoint-initdb.d:ro
      # Backup directory
      - ./data/influxdb-backups:/backups
    command: |
      bash -c "
        # Start InfluxDB in background
        /entrypoint.sh influxd &
        INFLUX_PID=$$!
        
        # Wait for InfluxDB to be ready
        echo 'Waiting for InfluxDB to start...'
        while ! curl -s http://localhost:8086/health | grep -q 'ready'; do
          sleep 2
        done
        
        # Run initialization scripts if they exist
        if [ -d /docker-entrypoint-initdb.d ]; then
          echo 'Running initialization scripts...'
          for script in /docker-entrypoint-initdb.d/*.sh; do
            if [ -f \"$$script\" ]; then
              echo \"Executing $$script\"
              bash \"$$script\"
            fi
          done
        fi
        
        # Keep InfluxDB running
        wait $$INFLUX_PID
      "
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8086/health"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s
    networks:
      - tradeknowledge
    deploy:
      resources:
        limits:
          memory: 2G
        reservations:
          memory: 1G

volumes:
  qdrant_data:
  redis_data:
  ollama_data:
  prometheus_data:
  grafana_data:
  nginx_logs:
  influxdb_data:
  influxdb_config:

networks:
  tradeknowledge:
    driver: bridge

# Development override
---
# docker-compose.dev.yml
version: '3.8'

services:
  tradeknowledge-api:
    build:
      target: development
    ports:
      - "8000:8000"
      - "5678:5678"  # Debug port
    environment:
      - ENVIRONMENT=development
      - DEBUG=true
      - LOG_LEVEL=DEBUG
    volumes:
      - .:/app
      - /app/venv  # Exclude venv from mount
    command: ["python", "-m", "uvicorn", "src.api.main:app", "--host", "0.0.0.0", "--port", "8000", "--reload", "--log-level", "debug"]

  # Skip resource-intensive services in development
  ollama:
    profiles: ["full"]
  
  prometheus:
    profiles: ["monitoring"]
  
  grafana:
    profiles: ["monitoring"]
  
  nginx:
    profiles: ["production"]