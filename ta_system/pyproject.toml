[tool.poetry]
name = "ta-system"
version = "0.1.0"
description = "Production-grade Technical Analysis and Stock Analysis System"
authors = ["Scott <scott@example.com>"]
readme = "README.md"
python = "^3.11"

[tool.poetry.dependencies]
python = "^3.11"
fastapi = "^0.104.1"
uvicorn = {extras = ["standard"], version = "^0.24.0"}
pydantic = "^2.5.0"
pandas = "^2.1.3"
numpy = "^1.26.2"
ta-lib = "^0.4.28"
pandas-ta = "^0.3.14b0"
yfinance = "^0.2.33"
redis = "^5.0.1"
asyncpg = "^0.29.0"
sqlalchemy = {extras = ["asyncio"], version = "^2.0.23"}
alembic = "^1.13.0"
httpx = "^0.25.2"
websockets = "^12.0"
structlog = "^23.2.0"
prometheus-client = "^0.19.0"
python-jose = {extras = ["cryptography"], version = "^3.3.0"}
passlib = {extras = ["bcrypt"], version = "^1.7.4"}
python-multipart = "^0.0.6"

[tool.poetry.group.dev.dependencies]
pytest = "^7.4.3"
pytest-asyncio = "^0.21.1"
pytest-cov = "^4.1.0"
pytest-benchmark = "^4.0.0"
hypothesis = "^6.92.1"
mutmut = "^2.4.4"
black = "^23.12.0"
ruff = "^0.1.8"
mypy = "^1.7.1"
bandit = "^1.7.5"
pre-commit = "^3.6.0"
ipykernel = "^6.27.1"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"

[tool.black]
line-length = 88
target-version = ['py311']

[tool.ruff]
line-length = 88
select = ["E", "F", "B", "I", "N", "UP", "S", "A", "C", "ICN", "PT", "Q", "RET", "SIM", "TID", "TCH", "ARG", "PL", "PIE", "RSE"]
ignore = ["E501", "B008", "C901", "S101"]

[tool.mypy]
python_version = "3.11"
strict = true
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
addopts = "-v --cov=src --cov-report=html --cov-report=term --cov-fail-under=90"

[tool.coverage.run]
source = ["src"]
omit = ["*/tests/*", "*/migrations/*"]

[tool.coverage.report]
precision = 2
show_missing = true
skip_covered = false