<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Trading Knowledge Teacher - Test</title>
    <style>
        body { font-family: Arial, sans-serif; margin: 20px; }
        .section { margin: 20px 0; padding: 20px; border: 1px solid #ddd; border-radius: 8px; }
        button { background: #007bff; color: white; border: none; padding: 10px 20px; border-radius: 4px; cursor: pointer; }
        button:hover { background: #0056b3; }
        textarea { width: 100%; height: 100px; margin: 10px 0; }
        .result { background: #f8f9fa; border: 1px solid #dee2e6; border-radius: 4px; padding: 15px; margin-top: 10px; white-space: pre-wrap; }
        .book-card { border: 1px solid #ddd; border-radius: 8px; padding: 15px; margin: 10px 0; }
        .concept-card { border: 1px solid #ddd; border-radius: 8px; padding: 10px; margin: 5px; display: inline-block; }
    </style>
</head>
<body>
    <h1>🧠 Trading Knowledge Teacher - Test Interface</h1>
    
    <div class="section">
        <h2>📚 Book Library</h2>
        <button onclick="loadBooks()">Load Books</button>
        <div id="books-result"></div>
    </div>
    
    <div class="section">
        <h2>🧠 Trading Concepts</h2>
        <button onclick="loadConcepts()">Load All Concepts</button>
        <div id="concepts-result"></div>
    </div>
    
    <div class="section">
        <h2>💬 Chat Test</h2>
        <textarea id="chat-input" placeholder="Ask a question like 'What is momentum strategy?' or 'Explain moving averages'"></textarea>
        <br>
        <button onclick="sendQuery()">Send Query</button>
        <div id="chat-result" class="result"></div>
    </div>
    
    <div class="section">
        <h2>📊 System Stats</h2>
        <button onclick="loadStats()">Load Stats</button>
        <div id="stats-result" class="result"></div>
    </div>

    <script>
        const API_BASE = 'http://localhost:8001/api';
        
        async function loadBooks() {
            try {
                const response = await fetch(`${API_BASE}/books`);
                const data = await response.json();
                
                let html = `<h3>Found ${data.books.length} books:</h3>`;
                
                data.books.forEach(book => {
                    html += `
                        <div class="book-card">
                            <h4>${book.title}</h4>
                            <p><strong>Author:</strong> ${book.author || 'Unknown'}</p>
                            <p><strong>Status:</strong> ${book.processing_status}</p>
                            <p><strong>Chapters:</strong> ${book.chapter_count}, <strong>Words:</strong> ${book.word_count}</p>
                        </div>
                    `;
                });
                
                document.getElementById('books-result').innerHTML = html;
            } catch (error) {
                document.getElementById('books-result').innerHTML = `Error: ${error.message}`;
            }
        }
        
        async function loadConcepts() {
            try {
                const response = await fetch(`${API_BASE}/concepts?query=`);
                const data = await response.json();
                
                let html = `<h3>Found ${data.concepts.length} concepts:</h3>`;
                
                const categories = {};
                data.concepts.forEach(concept => {
                    if (!categories[concept.category]) {
                        categories[concept.category] = [];
                    }
                    categories[concept.category].push(concept);
                });
                
                Object.keys(categories).forEach(category => {
                    html += `<h4>${category.replace(/_/g, ' ').toUpperCase()}</h4>`;
                    categories[category].forEach(concept => {
                        html += `
                            <div class="concept-card">
                                <strong>${concept.name}</strong><br>
                                <small>Difficulty: ${concept.difficulty_level}/5</small>
                            </div>
                        `;
                    });
                });
                
                document.getElementById('concepts-result').innerHTML = html;
            } catch (error) {
                document.getElementById('concepts-result').innerHTML = `Error: ${error.message}`;
            }
        }
        
        async function sendQuery() {
            const input = document.getElementById('chat-input');
            const message = input.value.trim();
            
            if (!message) {
                alert('Please enter a question');
                return;
            }
            
            try {
                const response = await fetch(`${API_BASE}/query`, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                    },
                    body: JSON.stringify({
                        message: message,
                        user_id: 'default'
                    })
                });
                
                const data = await response.json();
                
                let result = `Query: "${message}"\n\n`;
                result += `Response:\n${data.content}\n\n`;
                result += `Concepts Covered: ${data.concepts_covered.join(', ')}\n`;
                result += `Difficulty Level: ${data.difficulty_level}\n`;
                result += `Source Books: ${data.source_books.length} books\n`;
                result += `Follow-up Suggestions: ${data.follow_up_suggestions.join(', ')}\n`;
                result += `Related Concepts: ${data.related_concepts.join(', ')}`;
                
                document.getElementById('chat-result').textContent = result;
                
            } catch (error) {
                document.getElementById('chat-result').textContent = `Error: ${error.message}`;
            }
        }
        
        async function loadStats() {
            try {
                const response = await fetch(`${API_BASE}/stats`);
                const data = await response.json();
                
                document.getElementById('stats-result').textContent = JSON.stringify(data, null, 2);
            } catch (error) {
                document.getElementById('stats-result').textContent = `Error: ${error.message}`;
            }
        }
        
        // Set some example queries
        document.getElementById('chat-input').value = 'What is momentum strategy?';
    </script>
</body>
</html>
